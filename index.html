<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }
    body {
      background: linear-gradient(180deg, #070d1e 0%, #001f54 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .screen {
      display: none;
      flex-direction: column;
      height: 100%;
      justify-content: space-between;
      width: 100%;
      max-width: 450px;
      padding: 20px;
    }
    .screen.active {
      display: flex;
    }

    .logo-box {
      background-color: #ffffff;
      width: 100%;
      padding: 16px 20px;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(0, 180, 216, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .logo-box h1 {
      color: #0077b6;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 3px;
      line-height: 1;
      margin: 0;
      text-align: center;
      width: 100%;
    }
    .icon-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      z-index: 2;
    }
    .quiz-icon {
      font-size: 160px;
      color: #00b4d8;
      filter: drop-shadow(0 0 12px rgba(0, 180, 216, 0.6));
      margin: 0 auto;
      display: block;
      padding-top: 20px;
      padding-bottom: 20px;
    }
    .glow-btn {
      background: #fff;
      color: #0077b6;
      border: 2px solid #00d2ff;
      border-radius: 25px;
      padding: 15px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 15px #00d2ff;
      transition: all 0.2s;
      width: 100%;
      margin-bottom: 20px;
      padding-left: 20px;
      padding-right: 20px;
    }

    .glow-btn:hover {
      transform: scale(1.02);
      background: #00d2ff;
      color: #fff;
    }
    .quiz-header-box {
      background: #fff;
      border-radius: 15px;
      padding: 14px 16px;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      border: 2px solid #00d2ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .quiz-header-box #question-count {
      color: #0a194e;
      font-weight: bold;
      font-size: 16px;
    }
    .quiz-header-box .header-divider {
      width: 100%;
      height: 1px;
      background: #00d2ff;
      opacity: 0.4;
      border: none;
    }
    .timer {
      background: #00d2ff;
      color: #001f54;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px #00d2ff;
      font-weight: bold;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: #1e293b;
      border-radius: 10px;
      margin: 15px 0;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #00d2ff;
      box-shadow: 0 0 8px #00d2ff;
      transition: width 0.3s ease;
    }

    .question-card {
      background: #fff;
      color: #0a194e;
      border-radius: 15px;
      padding: 20px 15px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
      border: 2px solid #00d2ff;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      padding: 20px;
    }
    .option-btn {
      background: #0f1c4d;
      border: 2px solid #00d2ff;
      border-radius: 12px;
      color: #fff;
      padding: 12px 15px;
      font-size: 15px;
      text-align: right;
      cursor: pointer;
      display: flex;
      align-items: center;
      flex-direction: row-reverse;
      gap: 12px;
      box-shadow: 0 0 8px rgba(0, 210, 255, 0.2);
      transition: 0.2s;
      width: 100%;
    }

    .option-btn .badge {
      background: #00d2ff;
      color: #000;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 6px;
    }
    .option-btn.correct {
      background: #10b981 !important;
      border-color: #34d399 !important;
      box-shadow: 0 0 12px #34d399 !important;
    }

    .option-btn.wrong {
      background: #ef4444 !important;
      border-color: #f87171 !important;
      box-shadow: 0 0 12px #f87171 !important;
    }

    
    .status-badge {
      background: #00d2ff;
      color: #000;
      padding: 6px 20px;
      border-radius: 12px;
      align-self: center;
      font-weight: bold;
      box-shadow: 0 0 10px #00d2ff;
      padding-top: 20px;
      padding-left: 20px;
    }
    .result-card {
      background: #fff;
      color: #0a194e;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      box-shadow: 0 0 25px rgba(0, 210, 255, 0.6);
      border: 2px solid #00d2ff;
    margin-bottom: 20px;
    margin-top: 20px;
    }

    .result-card h2 {
      font-size: 32px;
      margin-bottom: 10px;
    }
    
    .top-pattern, .bottom-pattern {
      position: absolute;
      width: 100%;
      height: 100px;
      background-image: radial-gradient(#00b4d8 2px, transparent 2px);
      background-size: 16px 16px;
      opacity: 0.25;
    }

    .top-pattern { top: 0; left: 0; }
    .bottom-pattern { bottom: 0; left: 0; }
    #question-text, .option-btn {
  direction: rtl;
  unicode-bidi: plaintext;
}
  </style>
</head>
<body>
  <div class="top-pattern"></div>

  <div class="mobile-frame">
    <div id="start-screen" class="screen active">
      <div class="logo-box">
        <h1>QUIZ</h1>
      </div>
      <div class="icon-container">
        <i class="fa-solid fa-brain quiz-icon"></i>
      </div>
      <button class="glow-btn" onclick="startQuiz()">START</button>
    </div>

    <div id="quiz-screen" class="screen">
      <div class="quiz-header-box">
        <span id="question-count">السؤال 1 / 10</span>
        <hr class="header-divider">
        <div class="timer" id="timer">15</div>
      </div>

      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>

      <div class="question-card">
        <h3 id="question-text">السؤال يظهر هنا</h3>
      </div>

      <div class="options-container" id="options-container"></div>
    </div>

    <div id="result-screen" class="screen">
      <div class="status-badge" id="status-badge">GREAT!</div>
      <div class="result-card">
        <h2 id="result-title">YOU WIN!</h2>
        <p id="score-text">أجبت على 0 من 10 بشكل صحيح</p>
      </div>
      <button class="glow-btn" onclick="restartQuiz()">TRY AGAIN</button>
    </div>
  </div>

  <div class="bottom-pattern"></div>
  <script src="script.js"></script>
</body>
</html>
